plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.kotlin.compose)
    alias(libs.plugins.ksp)
    alias(libs.plugins.firebase.crashlytics)
    id 'com.google.gms.google-services'
}

android {
    namespace 'org.paramanuseniorshealth.notices'
    compileSdk {
        version = release(36) {
            minorApiLevel = 1
        }
    }

    defaultConfig {
        applicationId "org.paramanuseniorshealth.notices"
        minSdk 26
        targetSdk 36
        versionCode 21
        versionName "0.8.5"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    sourceSets {
        androidTest.assets.srcDirs += "$projectDir/schemas"
    }

    buildTypes {
        release {
            optimization {
                enable true
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    buildFeatures {
        compose true
        // VERSION_NAME is shown in Settings, and doubles as the hidden testing unlock.
        buildConfig true
    }
}

// Exports the Room schema as JSON so future migrations can be diffed/tested.
ksp {
    arg('room.schemaLocation', "$projectDir/schemas".toString())
}

configurations.matching { it.name.toLowerCase().contains("androidtest") }.configureEach {
    // The Compose BOM pins kotlinx-serialization-core to 1.7.3 for the whole project, but
    // room-testing's precompiled migration-bundle serializers were built against a newer
    // kotlinx.serialization runtime (GeneratedSerializer.typeParametersSerializers()). Forced
    // only on the androidTest classpath so app code keeps the BOM's pin everywhere else -- app
    // code never deserializes a Room migration bundle, only room-testing does, so the BOM's
    // 1.7.3 pin is correct and safe for what actually ships to a device.
    def serializationVersion = libs.versions.kotlinxSerialization.get()
    resolutionStrategy {
        force "org.jetbrains.kotlinx:kotlinx-serialization-core:$serializationVersion"
        force "org.jetbrains.kotlinx:kotlinx-serialization-core-jvm:$serializationVersion"
        force "org.jetbrains.kotlinx:kotlinx-serialization-json:$serializationVersion"
        force "org.jetbrains.kotlinx:kotlinx-serialization-json-jvm:$serializationVersion"
    }
}

dependencies {
    implementation platform(libs.androidx.compose.bom)
    implementation libs.androidx.activity.compose
    implementation libs.androidx.compose.material3
    implementation libs.androidx.compose.ui
    implementation libs.androidx.compose.ui.graphics
    implementation libs.androidx.compose.ui.tooling.preview
    implementation libs.androidx.core.ktx
    implementation libs.androidx.lifecycle.runtime.ktx
    implementation libs.androidx.lifecycle.runtime.compose
    implementation libs.androidx.lifecycle.viewmodel.compose
    implementation platform(libs.firebase.bom)
    implementation libs.firebase.messaging
    implementation libs.firebase.auth
    implementation libs.firebase.database
    // The analytics kill switch, moved off RTDB: fetched over HTTPS, so it costs no realtime
    // connection against the Spark plan's hundred. See FirebaseRemoteConfigSwitch.
    implementation libs.firebase.config
    // Analytics is deliberately excluded from pulling the advertising-ID artifact: the Data
    // Safety advertising-ID answer stays "no", and the manifest's tools:node="remove" is the
    // second lock on the same guarantee. See docs/SYSTEM.md.
    implementation(libs.firebase.analytics) {
        exclude group: 'com.google.android.gms', module: 'play-services-ads-identifier'
    }
    implementation libs.firebase.crashlytics

    // The network artifact (coil-network-okhttp) is deliberately absent: every AsyncImage model
    // in this app is a local java.io.File, never a URL -- the UI never touches the network, and
    // leaving that dependency off keeps it that way structurally instead of by convention.
    implementation libs.coil.compose

    // Verification runs here rather than in onMessageReceived: see docs/decisions.md.
    implementation libs.androidx.work.runtime.ktx

    // Play's in-app update prompt, driven by each release's priority. See update/PlayUpdatePrompt.
    implementation libs.play.app.update

    implementation libs.androidx.room.runtime
    implementation libs.androidx.room.ktx
    ksp libs.androidx.room.compiler


    testImplementation libs.junit
    androidTestImplementation platform(libs.androidx.compose.bom)
    androidTestImplementation libs.androidx.compose.ui.test.junit4
    androidTestImplementation libs.androidx.espresso.core
    androidTestImplementation libs.androidx.junit
    androidTestImplementation libs.androidx.room.testing
    debugImplementation libs.androidx.compose.ui.test.manifest
    debugImplementation libs.androidx.compose.ui.tooling
}
